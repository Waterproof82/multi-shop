name: Resolver la URL a probar
description: >
  Devuelve la URL contra la que deben correr los tests de Playwright: la preview
  de Vercel del PR, o producción en un push a rama protegida.

inputs:
  url-produccion:
    description: URL del despliegue de producción, para los push a rama protegida.
    required: true
  token:
    description: Token de GitHub con permiso de lectura sobre deployments.
    required: true
  secreto-bypass:
    description: >
      Secreto de "Protection Bypass for Automation" de Vercel. Sin él, una
      preview protegida devuelve 401 a todo y los tests no llegan a la app.
    required: false
    default: ''
  minutos-de-espera:
    description: Cuánto esperar a que Vercel publique la preview.
    required: false
    default: '10'

outputs:
  url:
    description: URL contra la que ejecutar los tests.
    value: ${{ steps.resolver.outputs.url }}

runs:
  using: composite
  steps:
    - id: resolver
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.pull_request.head.sha }}
        ES_PR: ${{ github.event_name == 'pull_request' }}
        URL_PRODUCCION: ${{ inputs.url-produccion }}
        MINUTOS: ${{ inputs.minutos-de-espera }}
        SECRETO_BYPASS: ${{ inputs.secreto-bypass }}
      run: |
        set -euo pipefail

        if [ "$ES_PR" != "true" ]; then
          echo "Push a rama protegida → se prueba producción."
          echo "url=$URL_PRODUCCION" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Pull request → se espera la preview de Vercel para $SHA"

        # Vercel publica cada preview como un deployment de GitHub. Se sondea
        # porque una construcción en frío tarda varios minutos y este job puede
        # arrancar antes de que Vercel haya terminado.
        intentos=$(( MINUTOS * 6 ))
        for intento in $(seq 1 "$intentos"); do
          url=""
          for id in $(gh api "repos/$REPO/deployments?sha=$SHA&per_page=100" --jq '.[].id'); do
            encontrada=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" \
              --jq 'map(select(.state == "success" and .environment_url != null)) | .[0].environment_url // empty')
            if [ -n "$encontrada" ]; then url="$encontrada"; break; fi
          done

          if [ -n "$url" ]; then
            echo "Preview lista: $url"

            # Comprobar que se puede ATRAVESAR, no solo que existe. Si Vercel
            # Authentication está activa y no hay secreto de bypass, el edge
            # responde 401 a todo — y lo peor es que muchos tests pasarían por
            # el motivo equivocado (los que solo comprueban «devuelve 401»).
            respuesta=$(curl -s --max-time 20 \
              ${SECRETO_BYPASS:+-H "x-vercel-protection-bypass: $SECRETO_BYPASS"} \
              "$url/api/waiter/me" || true)

            if printf '%s' "$respuesta" | grep -q 'Protected deployment'; then
              echo "::error::La preview está protegida por Vercel Authentication y no se puede atravesar." >&2
              echo "::error::Para arreglarlo: Vercel → Project Settings → Deployment Protection →" >&2
              echo "::error::  'Protection Bypass for Automation' → generar el secreto." >&2
              echo "::error::Luego GitHub → Settings → Secrets and variables → Actions →" >&2
              echo "::error::  nuevo secret VERCEL_AUTOMATION_BYPASS_SECRET con ese valor." >&2
              echo "::error::Sin eso los tests no llegan a la app, y algunos pasarían en falso." >&2
              exit 1
            fi

            echo "url=$url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "  intento $intento/$intentos — preview aún no lista, reintentando en 10s"
          sleep 10
        done

        # Fallar es lo correcto. Caer a producción devolvería exactamente el
        # verde falso que esta acción existe para eliminar: los tests pasarían
        # interrogando el sitio desplegado, no el código propuesto.
        echo "::error::No se resolvió la preview de Vercel para $SHA tras $MINUTOS minutos." >&2
        echo "::error::Los E2E NO caen a producción a propósito: ese verde no significaría nada." >&2
        exit 1
