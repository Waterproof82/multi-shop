name: E2E

# Runs the FULL e2e/ suite (waiter, kitchen, CSRF, DB smoke, etc.) — not just
# e2e/compliance/, which has its own narrower, path-filtered workflow
# (compliance.yml) for legal/fiscal-critical changes. This workflow has no
# path filter: UI/API changes anywhere can affect these functional flows, so
# it runs on every push/PR to main/develop, mirroring ci.yml's trigger.
#
# ── UNA PUERTA DE DOS NIVELES ────────────────────────────────────────────────
# En los dos casos se prueba el despliegue de ESTE commit, nunca una URL fija.
# Antes había una URL fija de producción, así que en un PR la suite interrogaba
# el sitio YA DESPLEGADO en vez del código propuesto: pasaba en verde aunque el
# PR estuviera completamente roto. Era monitorización disfrazada de puerta.
#
#   PULL REQUEST → preview efímera de Vercel → ~143 de 209 tests.
#     Aislado y seguro: cada PR tiene su despliegue y no pisa a nadie.
#
#   PUSH a main/develop → despliegue del entorno de pruebas → los 209.
#     Se espera a que Vercel publique ESE commit antes de arrancar; si no, el
#     job probaría el despliegue anterior.
#
# POR QUÉ EN UN PR NO CORREN LOS 209
# El tenant se resuelve por HOSTNAME: `parseMainDomain()` → `findByDomain()`,
# la empresa sale del dominio de la petición. Una preview tiene un host efímero
# (`multi-shop-<hash>-<team>.vercel.app`) que NO está en `empresas.dominio`, así
# que no hay tenant, el login del camarero falla, y los ~55 flujos con sesión se
# saltan. No es un fallo del CI: es consecuencia de que la multi-tenencia sea
# por dominio, y no se arregla con secrets.
#
# Tampoco se puede falsear la cabecera `Host`: Vercel enruta con ella, así que
# mandarla apuntando al entorno de pruebas devolvería ese despliegue en vez de
# la preview — exactamente lo que se quiere evitar.
#
# Por eso la cobertura completa vive en el push posterior al merge, contra un
# hostname fijo que sí está dado de alta como dominio de empresa.
#
# ── LO QUE NO SE CONSTRUYE AQUÍ, Y POR QUÉ ───────────────────────────────────
# Sería más autónomo levantar la app en CI, pero `validateEnv()` exige
# ACCESS_TOKEN_SECRET, CSRF_HMAC_SECRET y CART_TOKEN_SECRET, que no están entre
# los secrets del repositorio: la app se negaría a arrancar. Vercel sí los
# tiene, así que se reutiliza su despliegue en vez de duplicar configuración.
#
# ── COBERTURA QUE AÚN FALTA ──────────────────────────────────────────────────
# `CRON_SECRET` no está definido: desbloquea un test de la purga RGPD.

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  playwright-e2e:
    name: Playwright — Full E2E suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_WAITER_PIN: ${{ secrets.PLAYWRIGHT_WAITER_PIN }}
      PLAYWRIGHT_WAITER_TOKEN: ${{ secrets.PLAYWRIGHT_WAITER_TOKEN }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # En un PR, espera a que Vercel termine la preview de ESTE commit y coge
      # su URL. Sin esto, los tests interrogarían producción y darían verde
      # aunque el PR estuviera roto.
      - name: Resolver la URL a probar
        id: destino
        uses: ./.github/actions/resolver-url-a-probar
        with:
          token: ${{ github.token }}
          secreto-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full E2E suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.destino.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test e2e/ --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 30
