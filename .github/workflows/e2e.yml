name: E2E

# Runs the FULL e2e/ suite (waiter, kitchen, CSRF, DB smoke, etc.) — not just
# e2e/compliance/, which has its own narrower, path-filtered workflow
# (compliance.yml) for legal/fiscal-critical changes. This workflow has no
# path filter: UI/API changes anywhere can affect these functional flows, so
# it runs on every push/PR to main/develop, mirroring ci.yml's trigger.
#
# ── CONTRA QUÉ SE EJECUTA ────────────────────────────────────────────────────
# En un PULL REQUEST, contra la preview que Vercel construye para ESE PR.
# En un PUSH a main/develop, contra el despliegue de producción.
#
# La distinción es la razón de ser de este workflow. Antes apuntaba siempre a la
# URL fija de producción, así que en un PR interrogaba el sitio YA DESPLEGADO en
# vez del código propuesto: la suite pasaba en verde aunque el PR estuviera
# completamente roto. Era monitorización disfrazada de puerta de calidad.
#
# No se construye la app aquí porque no se puede: `validateEnv()` exige
# ACCESS_TOKEN_SECRET, CSRF_HMAC_SECRET y CART_TOKEN_SECRET, que no están entre
# los secrets del repositorio. La preview de Vercel sí los tiene, así que se
# reutiliza en vez de duplicar la configuración.
#
# ── COBERTURA QUE FALTA ──────────────────────────────────────────────────────
# Los tests que necesitan credenciales (PLAYWRIGHT_WAITER_PIN,
# PLAYWRIGHT_ADMIN_EMAIL/PASSWORD, PLAYWRIGHT_WAITER_TOKEN) se SALTAN si esos
# secrets no existen — y a día de hoy NO existen en este repositorio. Es decir:
# en CI solo corren las pruebas sin autenticar. Añadirlos en
# Settings > Secrets and variables > Actions desbloquea el resto.

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  playwright-e2e:
    name: Playwright — Full E2E suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_WAITER_PIN: ${{ secrets.PLAYWRIGHT_WAITER_PIN }}
      PLAYWRIGHT_WAITER_TOKEN: ${{ secrets.PLAYWRIGHT_WAITER_TOKEN }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # En un PR, espera a que Vercel termine la preview de ESTE commit y coge
      # su URL. Sin esto, los tests interrogarían producción y darían verde
      # aunque el PR estuviera roto.
      - name: Resolver la URL a probar
        id: destino
        uses: ./.github/actions/resolver-url-a-probar
        with:
          url-produccion: https://mermelada-tomate.vercel.app
          token: ${{ github.token }}
          secreto-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full E2E suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.destino.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test e2e/ --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 30
