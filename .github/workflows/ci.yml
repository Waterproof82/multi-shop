name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

  # Corre TODA la suite de vitest (proyectos `unit` y `ui`) en cada push y PR.
  #
  # No se apoya en `compliance.yml` a proposito: aquel esta filtrado por rutas
  # (migraciones, rutas de API concretas, `tests/compliance/**`), y
  # `src/components/**` NO esta en la lista. Un PR que solo tocara un componente
  # se saltaba los tests estaticos — incluido el guard que impide reintroducir
  # `next/image` sobre imagenes ya optimizadas, que vive precisamente para
  # atrapar un cambio en `src/components/**`.
  #
  # Este workflow solo ignora `docs/**` y `*.md`, asi que aqui no hay hueco.
  vitest:
    name: Vitest — Unit & UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SENTRY_DSN: https://placeholder@placeholder.ingest.sentry.io/0
      # Skip Sentry source map upload in CI (no auth token)
      SENTRY_DISABLE_SOURCE_MAP_UPLOAD: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
